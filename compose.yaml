services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_DEFAULT_VLM_PRESET: litellm
      DOCLING_SERVE_ALLOWED_VLM_PRESETS: '["litellm"]'
      DOCLING_SERVE_ALLOWED_VLM_ENGINES: '["api"]'
      DOCLING_SERVE_CUSTOM_VLM_PRESETS: >-
        {
          "litellm": {
            "model_spec": {
              "name": "LiteLLM",
              "default_repo_id": "${LITELLM_MODEL:?Set LITELLM_MODEL in .env}",
              "prompt": "${VLM_PROMPT:-Convert this page to markdown. Do not miss any text and only output the bare markdown!}",
              "response_format": "${VLM_RESPONSE_FORMAT:-markdown}"
            },
            "engine_options": {
              "engine_type": "api",
              "url": "${LITELLM_CHAT_COMPLETIONS_URL:-http://host.docker.internal:4000/v1/chat/completions}",
              "headers": {
                "Authorization": "${LITELLM_AUTH_SCHEME:-Bearer} ${LITELLM_API_KEY:-}"
              },
              "params": {
                "model": "${LITELLM_MODEL:?Set LITELLM_MODEL in .env}",
                "max_tokens": 4096,
                "temperature": 0
              },
              "timeout": 180,
              "concurrency": 1
            },
            "scale": 2.0
          }
        }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
