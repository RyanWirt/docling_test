name: StackRox PR Image Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stackrox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        run: |
          # GHCR requires a lowercase repository name
          REPO="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          TAG="pr-${{ github.event.pull_request.number || github.run_id }}-${GITHUB_SHA::7}"
          echo "image=${REPO}:${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  stackrox-scan:
    name: StackRox Image Scan
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs have no access to secrets, so skip them
    if: >-
      vars.ROX_CENTRAL_ENDPOINT != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      ROX_CENTRAL_ENDPOINT: ${{ vars.ROX_CENTRAL_ENDPOINT }}
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
      ROX_CA_CERT: ${{ secrets.ROX_CA_CERT }}
      ROX_INSECURE_SKIP_TLS_VERIFY: ${{ vars.ROX_INSECURE_SKIP_TLS_VERIFY }}
    steps:
      - name: Prepare TLS trust
        run: |
          set -eu
          if [ -n "${ROX_CA_CERT}" ]; then
            CA_FILE="${RUNNER_TEMP}/stackrox-ca.pem"
            cat /etc/ssl/certs/ca-certificates.crt > "${CA_FILE}"
            printf '\n%s\n' "${ROX_CA_CERT}" >> "${CA_FILE}"
            chmod 600 "${CA_FILE}"
            echo "SSL_CERT_FILE=${CA_FILE}" >> "${GITHUB_ENV}"
          fi
          if [ "${ROX_INSECURE_SKIP_TLS_VERIFY}" = "true" ]; then
            echo "ROX_INSECURE_SKIP_TLS_VERIFY=true" >> "${GITHUB_ENV}"
          fi

      - name: Download roxctl
        run: |
          set -eu
          FLAGS=(-sSfL --retry 5 --connect-timeout 10 --max-time 120)
          [ -n "${SSL_CERT_FILE:-}" ] && FLAGS+=(--cacert "${SSL_CERT_FILE}")
          [ "${ROX_INSECURE_SKIP_TLS_VERIFY}" = "true" ] && FLAGS+=(-k)
          if ! curl "${FLAGS[@]}" -H "Authorization: Bearer ${ROX_API_TOKEN}" \
              "https://${ROX_CENTRAL_ENDPOINT}/api/cli/download/roxctl-linux" -o roxctl; then
            echo "::warning::Central download failed, falling back to mirror.openshift.com"
            curl -sSfL --retry 3 \
              "https://mirror.openshift.com/pub/rhacs/assets/latest/bin/linux/roxctl" -o roxctl
          fi
          chmod +x roxctl

      # roxctl asks Central to pull the image, so Central needs a GHCR
      # integration (read:packages PAT) configured for ghcr.io.
      - name: StackRox image scan
        run: |
          ./roxctl image scan -e "${ROX_CENTRAL_ENDPOINT}" --image "${IMAGE}" --output table \
            ${ROX_INSECURE_SKIP_TLS_VERIFY:+--insecure-skip-tls-verify}

      - name: StackRox image check
        run: |
          ./roxctl image check -e "${ROX_CENTRAL_ENDPOINT}" --image "${IMAGE}" \
            ${ROX_INSECURE_SKIP_TLS_VERIFY:+--insecure-skip-tls-verify}
